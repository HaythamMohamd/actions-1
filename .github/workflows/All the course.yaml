# ################################################## 10- schedual  ##################################################

name: Docker Build and Deploy (Scheduled)

on: 
  schedule:
    - cron: "*/1 * * * *"  # every 1 minute

env:
  CONTAINER_REGISTRY: docker.io
  IMAGE_NAME: github-actions

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Docker build
        run: |
          docker build -t $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$IMAGE_NAME:latest .

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login $CONTAINER_REGISTRY -u "${{ vars.DOCKER_USERNAME }}" --password-stdin

      - name: Docker push
        run: |
          docker push $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$IMAGE_NAME:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$IMAGE_NAME_
